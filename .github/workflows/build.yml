name: Build Epsilon N0120

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git imagemagick libx11-dev libxext-dev libfreetype6-dev libpng-dev libjpeg-dev pkg-config gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi python3-pil

      - name: Build firmware
        run: make PLATFORM=n0120

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: epsilon-n0120-firmware
          path: output/
