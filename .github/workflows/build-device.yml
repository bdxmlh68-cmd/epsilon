name: Device build
on:
  workflow_dispatch:
    inputs:
      beta:
        type: boolean
        default: false

env:
  MAKEFLAGS: -j2
  BETA: ${{ fromJSON(github.event.inputs.beta) && '.beta' || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download toolchain
        uses: numworks/setup-arm-toolchain@latest
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build container and define DOCKER_RUN
        uses: ./.github/actions/docker-builder
        with:
          platform: device
      - name: Build n0120
        run: $DOCKER_RUN "make PLATFORM=n0120 epsilon_userland.dfu"
      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-device-builds
          path: epsilon/output/**/*.dfu
          retention-days: 3
